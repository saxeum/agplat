# Step 1: the API and Postgres/pgvector. Only loopback is published: this
# service has no auth by design.
name: agplat

services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      # Same key file used on the host; values are not baked into the image.
      - path: ${HOME}/.env
        required: false
    environment:
      AGPLAT_DB_URL: postgresql://agplat:agplat@db:5432/agplat
      PYTHONPATH: /app/src
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Edit on the host, reload in the container. The image still works
      # without these mounts; they are a development convenience.
      - ./src:/app/src
      - ./agents:/app/agents
    command: uvicorn agplat.main:create_app --factory --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import sys, urllib.request;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)
      interval: 10s
      timeout: 3s
      retries: 3

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agplat
      POSTGRES_PASSWORD: agplat
      POSTGRES_DB: agplat
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agplat -d agplat"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
