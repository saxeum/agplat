# Step 1: the API and the trace store. Only loopback is published: this
# service has no auth by design.
name: agplat

services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      # Same key file used on the host; values are not baked into the image.
      - path: ${HOME}/.env
        required: false
    environment:
      AGPLAT_PHOENIX_URL: http://phoenix:6006
      PYTHONPATH: /app/src
    depends_on:
      phoenix:
        condition: service_started
    volumes:
      # Edit on the host, reload in the container. The image still works
      # without these mounts; they are a development convenience.
      - ./src:/app/src
      - ./agents:/app/agents
    command: uvicorn agplat.main:create_app --factory --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import sys, urllib.request;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)
      interval: 10s
      timeout: 3s
      retries: 3

  # Run records live here. Auth is off because the port is loopback-only and the
  # alternative is a token to manage in a PoC; turn it on before exposing it.
  phoenix:
    # Pinned by digest, like every other build input here.
    image: arizephoenix/phoenix@sha256:09ec48906c054a27dd09a88c8e6bcc24fe89649d3ecc94d3a8ed394e21279b31
    ports:
      - "127.0.0.1:6006:6006"
    environment:
      PHOENIX_ENABLE_AUTH: "false"
      PHOENIX_WORKING_DIR: /phoenix
    volumes:
      - phoenix_data:/phoenix

volumes:
  phoenix_data:
