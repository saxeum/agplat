# Step 0: the API only. Postgres joins in Step 1. Only loopback is published:
# this service has no auth by design.
name: agplat

services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      # Same key file used on the host; values are not baked into the image.
      - path: ${HOME}/.env
        required: false
    environment:
      PYTHONPATH: /app/src
    volumes:
      # Edit on the host, reload in the container. The image still works
      # without these mounts; they are a development convenience.
      - ./src:/app/src
      - ./agents:/app/agents
    command: uvicorn agplat.main:create_app --factory --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import sys, urllib.request;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)
      interval: 10s
      timeout: 3s
      retries: 3
