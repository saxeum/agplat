name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: a pull request cannot use this workflow to write to the
# repository. Nothing here needs more than checkout.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      # Fails if pyproject.toml and uv.lock disagree: the two must move together.
      - name: Check lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github src tests

      - name: Typecheck
        run: uv run basedpyright

      - name: Test
        run: make test-all

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agplat
          POSTGRES_PASSWORD: agplat
          POSTGRES_DB: agplat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agplat -d agplat_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Check lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked

      - name: Migrate
        run: uv run python -m agplat.migrate
        env:
          AGPLAT_DB_URL: postgresql://agplat:agplat@127.0.0.1:5432/agplat_test

      - name: Integration tests
        run: uv run pytest -m integration -q
        env:
          AGPLAT_TEST_DB_URL: postgresql://agplat:agplat@127.0.0.1:5432/agplat_test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Smoke-test the image
        run: ./scripts/docker-smoke.sh
