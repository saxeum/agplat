[project]
name = "agplat"
version = "0.0.0"
description = "A local, REST-only multi-agent knowledge platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "pydantic-ai-slim[openai]>=2.71,<3",
    "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.0,<9",
    "ruff>=0.8,<1",
]

[project.scripts]
agplat = "agplat.__main__:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
