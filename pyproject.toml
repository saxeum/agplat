[project]
name = "agplat"
version = "0.0.0"
description = "A local, REST-only multi-agent knowledge platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "pydantic-ai-slim[openai]>=2.71,<3",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.2.4",
    "asyncpg>=0.32.0",
]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "httpx>=0.27,<1",
    "pytest>=8.0,<10",
    "pytest-cov>=7.1.0",
    "ruff==0.17.6",
]

[project.scripts]
agplat = "agplat.__main__:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: requires AGPLAT_TEST_DB_URL"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
# Zed's basedpyright default; basedpyright on its own defaults to "recommended".
typeCheckingMode = "standard"
include = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["agplat"]

[tool.coverage.report]
show_missing = true
fail_under = 95
